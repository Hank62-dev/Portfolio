name: Android app

# Builds the Android app (a Capacitor shell that opens the live site, see capacitor.config.json) into an APK.
# Runs when the shell changes, or by hand from the Actions tab. The APK is attached to the run as an artifact; a run started
# by hand with "release" ticked also puts it on a GitHub Release, so there is one link to download it from.
#
# Signing: with the four ANDROID_* secrets set, the release APK is signed with the one fixed key (see ANDROID_APP_PLAN.md).
# Without them only the debug APK is built: it installs, but a later signed APK will not install over it.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-shell/**'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the APK as a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write # only used to create the release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # copies app-shell/ and the plugin list into the Android project (the site itself is loaded live, not bundled)
      - run: npx cap sync android

      # Firebase's settings for the app (notifications from the server). Not in the repo: its API key would trip the secret scan.
      # Make it with: base64 -w0 android/app/google-services.json, and save it as the GOOGLE_SERVICES_JSON_BASE64 secret.
      - name: Restore the Firebase settings
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON_BASE64 secret is missing: without it the app cannot receive notifications from the server."
            exit 1
          fi
          echo "$GOOGLE_SERVICES" | base64 -d > android/app/google-services.json

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key in the secrets: building the debug APK only."
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            src=android/app/build/outputs/apk/release/app-release.apk; kind=release
          else
            src=android/app/build/outputs/apk/debug/app-debug.apk; kind=debug
          fi
          name="hank62-${version}-${kind}.apk"
          cp "$src" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish a release
        if: ${{ inputs.release && steps.apk.outputs.kind == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ steps.apk.outputs.version }}-${{ github.run_number }}"
          gh release create "$tag" "${{ steps.apk.outputs.name }}" --title "Hank62 Android ${{ steps.apk.outputs.version }}" --notes "Android app build ${{ github.run_number }}. Install the APK on the phone; it opens the live site, so the web's updates arrive by themselves."
