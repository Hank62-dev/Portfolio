services:
  - type: web
    name: hank62-realtime
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run spacehank:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SPACEHANK_PORT
        value: 10000
      - key: SPACEHANK_PASSWORD
        sync: false
      - key: SPACEHANK_ORIGIN
        sync: false
      - key: SPACEHANK_WORKDIR
        value: /opt/render/project/src
      # Optional owner helpers (Hank DJ, morning note, Image Studio, calendar). Leave blank to switch them off.
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CALENDAR_ICS_URL
        sync: false
      # The Calendar tab, two-way with Google Calendar (SPACEHANK_SETUP.md 4.2e). Needs DATABASE_URL.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: CALENDAR_TOKEN_KEY
        sync: false
      # Keeps notes, diary, photos, habits, money and the Creator Lab in step across devices. A Postgres address (Neon's free tier works).
      # Leave blank and each device keeps its own copy.
      - key: DATABASE_URL
        sync: false
      # Web Push: reminders that arrive with the app closed. Make the pair once with `npx web-push generate-vapid-keys`; the
      # subject is mailto: and your address. Needs DATABASE_URL too. PUSH_TIMEZONE is optional (default Asia/Ho_Chi_Minh).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Creator Lab: post announcements to your own Discord server. A webhook address (Server Settings, Integrations, Webhooks). Leave blank to switch it off.
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: AI_DAILY_LIMIT
        value: 60
      # Locks the Hank RAG service: it only answers a request with a ticket from this server. Give BOTH services the same value.
      - key: RAG_TOKEN_SECRET
        sync: false
      # Optional: the password as a scrypt hash (npm run spacehank:hash-password) instead of SPACEHANK_PASSWORD
      - key: SPACEHANK_PASSWORD_HASH
        sync: false

  - type: web
    name: hank62-rag
    runtime: python
    plan: free  # 512MB RAM, sleeps after 15 min idle, no persistent disk
    rootDir: .integrations/hank62-rag
    buildCommand: rm -rf .venv && pip install uv && uv sync --frozen
    startCommand: uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.8-flash
      # tried when the main model stays overloaded (503) after a few retries; if this name is wrong the original error is raised
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # The same value as on hank62-realtime: requests without a ticket signed with it are refused
      - key: RAG_TOKEN_SECRET
        sync: false
