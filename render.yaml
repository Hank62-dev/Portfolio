services:
  - type: web
    name: hank62-realtime
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run spacehank:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SPACEHANK_PORT
        value: 10000
      - key: SPACEHANK_PASSWORD
        sync: false
      - key: SPACEHANK_ORIGIN
        sync: false
      - key: SPACEHANK_WORKDIR
        value: /opt/render/project/src
      # Optional owner helpers (Hank DJ, morning note, Image Studio, calendar). Leave blank to switch them off.
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CALENDAR_ICS_URL
        sync: false
      - key: AI_DAILY_LIMIT
        value: 60

  - type: web
    name: hank62-rag
    runtime: python
    plan: free  # 512MB RAM, sleeps after 15 min idle, no persistent disk
    rootDir: .integrations/hank62-rag
    buildCommand: rm -rf .venv && pip install uv && uv sync --frozen
    startCommand: uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.8-flash
      # tried when the main model stays overloaded (503) after a few retries; if this name is wrong the original error is raised
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
